# =====================================================================
#  RadarBolsa · parámetros del motor de datos (GitHub Actions)
#  Tickers de Yahoo Finance. Las exclusiones y la cartera se gestionan
#  desde la app; config/cartera.yaml lo sincroniza Claude cada día.
# =====================================================================

# Referencia de "nivel habitual": percentil del último año (252 sesiones)
referencia_percentil: 80

# --- Alertas por email (descuento vs P80, en %) -----------------------
alertas:
  indice_5d: -5
  indice_vs_p80: -8
  sector_vs_p80: -12

# --- Radar de oportunidades -------------------------------------------
radar:
  accion_min_descuento: -12   # la acción debe estar al menos un 12% por debajo de su P80
  etf_min_descuento: -6       # sectores / índices
  min_casos: 8                # precedentes mínimos para fiarse de la estadística
  max_por_sector: 3           # diversificación en la lista de acciones
  n_acciones: 30              # cuántas acciones pasan al radar con ficha completa

# --- Índices de referencia --------------------------------------------
indices:
  - {ticker: EUNL.DE,   nombre: "MSCI World (EUR)",  comprable: "iShares Core MSCI World UCITS ETF (Acc)", isin: IE00B4L5Y983}
  - {ticker: ^GSPC,     nombre: "S&P 500",           comprable: "iShares Core S&P 500 UCITS ETF (Acc)",    isin: IE00B5BMR087}
  - {ticker: ^NDX,      nombre: "Nasdaq 100",        comprable: "iShares Nasdaq 100 UCITS ETF (Acc)",      isin: IE00B53SZB19}
  - {ticker: ^STOXX,    nombre: "STOXX Europe 600",  comprable: "iShares STOXX Europe 600 UCITS ETF (DE)", isin: DE0002635307}
  - {ticker: ^STOXX50E, nombre: "Euro Stoxx 50",     comprable: "iShares Core EURO STOXX 50 UCITS ETF (Acc)", isin: IE00B53L3W79}
  - {ticker: ^IBEX,     nombre: "IBEX 35",           comprable: "ETF IBEX 35 (buscar en Trade Republic)", isin: ""}
  - {ticker: EIMI.L,    nombre: "Emergentes",        comprable: "iShares Core MSCI EM IMI UCITS ETF (Acc)", isin: IE00BKM4GZ66, moneda: USD}

contexto:
  - {ticker: ^VIX,  nombre: "VIX · miedo"}
  - {ticker: 6E=F,  nombre: "Euro / dólar", moneda: USD}
  - {ticker: GC=F,  nombre: "Oro"}
  - {ticker: BZ=F,  nombre: "Brent"}

# --- Sectores: ETF de EE. UU. (estadística desde 1998) + UCITS comprable
