# =====================================================================
#  RadarBolsa · parámetros
#  Este es el único fichero que hace falta tocar para cambiar qué se
#  vigila, los umbrales de alerta o el plan de inversión por tramos.
#  Los tickers son los de Yahoo Finance (fuente de los datos).
# =====================================================================

# --- Umbrales de alerta (en %, valores negativos = caída) -------------
alertas:
  indice_5d: -5          # índice amplio: caída en 5 sesiones
  indice_desde_max: -10  # índice amplio: caída desde máximo de 52 semanas
  sector_desde_max: -15  # sector: caída desde máximo de 52 semanas
  empresa_desde_max: -25 # empresa: caída desde máximo de 52 semanas

# --- Plan de despliegue por tramos -----------------------------------
# Se mide sobre la referencia (MSCI World en euros) y su caída desde el
# máximo de 52 semanas. Cada tramo indica el % del capital disponible.
tramos:
  referencia: EUNL.DE
  capital: 75000
  niveles:
    - {caida: -10, peso: 25}
    - {caida: -15, peso: 25}
    - {caida: -20, peso: 25}
    - {caida: -30, peso: 25}

# --- Índices de referencia --------------------------------------------
# ticker: serie que se analiza · comprable: ETF UCITS que se puede comprar
# en Europa (verificar ISIN en Trade Republic antes de comprar).
indices:
  - {ticker: EUNL.DE,   nombre: "MSCI World (EUR)",        comprable: "iShares Core MSCI World UCITS ETF (Acc)", isin: IE00B4L5Y983}
  - {ticker: ^GSPC,     nombre: "S&P 500 (EE. UU.)",       comprable: "iShares Core S&P 500 UCITS ETF (Acc)",    isin: IE00B5BMR087}
  - {ticker: ^NDX,      nombre: "Nasdaq 100 (tecnológicas EE. UU.)", comprable: "iShares Nasdaq 100 UCITS ETF (Acc)", isin: IE00B53SZB19}
  - {ticker: ^STOXX,    nombre: "STOXX Europe 600",        comprable: "iShares STOXX Europe 600 UCITS ETF (DE)", isin: DE0002635307}
  - {ticker: ^STOXX50E, nombre: "Euro Stoxx 50",           comprable: "iShares Core EURO STOXX 50 UCITS ETF (Acc)", isin: IE00B53L3W79}
  - {ticker: ^IBEX,     nombre: "IBEX 35",                 comprable: "ETF IBEX 35 (buscar en Trade Republic)", isin: ""}
  - {ticker: EIMI.L,    nombre: "Mercados emergentes",     comprable: "iShares Core MSCI EM IMI UCITS ETF (Acc)", isin: IE00BKM4GZ66}

# Indicadores de contexto (no se compran; ayudan a leer el momento)
contexto:
  - {ticker: ^VIX,    nombre: "VIX (índice del miedo)"}
  - {ticker: 6E=F,    nombre: "Euro / dólar (futuro)"}
  - {ticker: GC=F,    nombre: "Oro (USD/onza)"}
  - {ticker: BZ=F,    nombre: "Petróleo Brent (USD)"}

# --- Sectores ---------------------------------------------------------
# ticker: ETF sectorial de EE. UU. (historia desde 1998 → estadística
# más robusta; NO comprable desde la UE).
# ticker_ucits: versión mundial comprable en Europa (Xtrackers MSCI World
