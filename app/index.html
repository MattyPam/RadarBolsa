<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadarBolsa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* VOICE: herramienta de trabajo tranquila y directa, hermana de la app de finanzas del hogar.
   IDEA: un radar que compara cada producto con su nivel habitual (percentil 80 del último año).
   PICTURE: barras de descuento frente al nivel habitual y fichas de análisis en cajas de color.
   COLOUR and TYPE: verde menta de marca, coral para lo que duele, ámbar para riesgo; tipografía del sistema.
   LAYOUT: ancho completo 16:9, cabecera fija con pestañas y buscador, rejillas de tarjetas. */
:root{
  color-scheme:dark light;
  --bg:light-dark(#f4f8f6,#0e1614); --panel:light-dark(#ffffff,#15201d); --panel2:light-dark(#eef4f1,#1c2a26);
  --panel3:light-dark(#e3ece8,#223029); --line:light-dark(#dbe6e1,#2a3b35); --line2:light-dark(#e8efec,#223029);
  --tx:light-dark(#13211d,#e8f2ee); --tx2:light-dark(#5f756e,#8fa9a1);
  --acc:light-dark(#0f9d76,#2dd4a7); --accTx:light-dark(#ffffff,#05251c);
  --warn:light-dark(#b97d09,#f5b945); --bad:light-dark(#d2654c,#f08a72);
  --c3:light-dark(#2f93b8,#56b8d8); --c5:light-dark(#7b6cb8,#9d8fd0); --c6:light-dark(#c26a94,#dd8aae);
  --sombra:0 1px 2px light-dark(rgba(18,42,36,.07),rgba(0,0,0,.28));
  --sombraAlta:0 10px 30px light-dark(rgba(18,42,36,.16),rgba(0,0,0,.45));
}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--c3)}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px clamp(14px,2vw,28px);position:sticky;top:0;z-index:40;box-shadow:var(--sombra)}
.cab{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:19px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
h1 small{color:var(--tx2);font-weight:400;font-size:12px}
.radar-ico{width:22px;height:22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 15px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--tx2);cursor:pointer;font-size:13.5px;transition:background .14s,color .14s}
.tab:hover{color:var(--tx);background:var(--panel2)}
.tab.on{background:var(--acc);color:var(--accTx);font-weight:650}
.buscador{flex:1 1 380px;display:flex;gap:8px;margin-left:auto;max-width:720px}
.buscador input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14.5px}
.buscador input:focus{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:7px 15px;cursor:pointer;font-size:13px;white-space:nowrap;transition:all .14s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accTx);font-weight:650}
.btn.pri:hover{filter:brightness(1.08);color:var(--accTx)}
.btn.sm{padding:4px 11px;font-size:12px}
.btn.ghost{background:transparent}
.btn.peligro:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ico{padding:7px 11px}
main{padding:20px clamp(14px,2vw,28px) 60px}
.seccion{display:none}.seccion.on{display:block}
h2.sep{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--tx2);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.sep:after{content:'';flex:1;height:1px;background:var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra)}
.card h3{margin:0 0 10px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hint{font-size:12px;color:var(--tx2);font-weight:400}
.g{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.g-2{grid-template-columns:minmax(0,1.05fr) minmax(0,1.6fr)}
.g-tarj{grid-template-columns:repeat(auto-fill,minmax(min(100%,470px),1fr))}
@media(max-width:1100px){.g-2{grid-template-columns:1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sombra);cursor:pointer;transition:border-color .14s}
.kpi:hover{border-color:var(--acc)}
.kpi .l{font-size:12px;color:var(--tx2);display:flex;justify-content:space-between;gap:6px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.6px;margin-top:2px}
.kpi .s{font-size:12px;color:var(--tx2)}
.kpi svg{width:100%;height:36px;display:block;margin-top:6px}
.pos{color:var(--acc)}.neg{color:var(--bad)}.mut{color:var(--tx2)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);white-space:nowrap;font-weight:600}
.badge .dot{width:8px;height:8px;border-radius:50%}
.b-verde{color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent)}
.b-ambar{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.b-rojo{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.b-gris,.b-neutro{color:var(--tx2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;cursor:pointer;margin:0 6px 6px 0}
.chip:hover{border-color:var(--acc)}
.chip.alerta{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.chip.nueva:after{content:'nueva';font-size:10px;background:var(--bad);color:#fff;border-radius:6px;padding:1px 5px}
/* barras divergentes */
.barras{display:grid;gap:7px}
.barra{display:grid;grid-template-columns:150px 1fr 64px 120px;align-items:center;gap:10px;cursor:pointer;padding:3px 4px;border-radius:8px}
.barra:hover{background:var(--panel2)}
.barra .pista{position:relative;height:16px}
.barra .cero{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--tx2);opacity:.5}
.barra .r{position:absolute;top:2px;height:12px;border-radius:4px}
@media(max-width:600px){.barra{grid-template-columns:100px 1fr 54px}.barra .bd{display:none}}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--tx2)}
.seg button.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);font-weight:650}
/* tarjetas con ficha */
.tarj{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sombra);display:flex;flex-direction:column;overflow:hidden}
.tarj .cabt{padding:14px 16px 10px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.tarj .nom{font-size:16px;font-weight:700;letter-spacing:-.2px;cursor:pointer}
.tarj .nom:hover{color:var(--acc)}
.tarj .meta{font-size:12px;color:var(--tx2)}
.tarj .big{font-size:24px;font-weight:750;text-align:right;letter-spacing:-.5px;line-height:1.1}
.tarj .big small{display:block;font-size:11px;font-weight:500;color:var(--tx2);letter-spacing:0}
.stats{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.st{background:var(--panel2);border-radius:9px;padding:5px 9px;font-size:12px}
.st b{font-weight:700}
.ficha{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 12px}
.caja{border-radius:11px;padding:9px 11px;font-size:13px;line-height:1.45;border:1px solid transparent}
.caja .t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.caja .t svg{width:13px;height:13px}
.caja p{margin:0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ficha.abierta .caja p{-webkit-line-clamp:unset;display:block}
.k-neg{background:color-mix(in srgb,var(--c3) 10%,transparent)}.k-neg .t{color:var(--c3)}
.k-cae{background:color-mix(in srgb,var(--bad) 10%,transparent)}.k-cae .t{color:var(--bad)}
.k-rie{background:color-mix(in srgb,var(--warn) 11%,transparent)}.k-rie .t{color:var(--warn)}
.k-opo{background:color-mix(in srgb,var(--acc) 11%,transparent)}.k-opo .t{color:var(--acc)}
.k-inv{background:color-mix(in srgb,var(--c5) 11%,transparent)}.k-inv .t{color:var(--c5)}
.k-dia{background:var(--panel2);border-color:var(--line)}.k-dia .t{color:var(--c6)}
.k-con{grid-column:1/-1;background:color-mix(in srgb,var(--acc) 7%,var(--panel));border-color:color-mix(in srgb,var(--acc) 45%,transparent)}.k-con .t{color:var(--acc)}
.k-con p{font-weight:550}
.aviso-ex{grid-column:1/-1;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);border-radius:10px;padding:7px 10px;font-size:12.5px}
.sinficha{margin:0 16px 12px;border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13px;color:var(--tx2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pie{margin-top:auto;border-top:1px solid var(--line2);padding:9px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pie .fecha{margin-left:auto;font-size:11.5px;color:var(--tx2)}
.ver-mas{font-size:12px;color:var(--c3);cursor:pointer;background:none;border:0;padding:0 16px 10px;text-align:left}
@media(max-width:560px){.ficha{grid-template-columns:1fr}}
/* tablas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--tx2);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.vacio{padding:24px;text-align:center;color:var(--tx2)}
/* panel lateral y detalle */
.velo{position:fixed;inset:0;background:rgba(5,15,12,.5);z-index:60;display:none}
.velo.on{display:block}
.lateral{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:61;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:var(--sombraAlta)}
.lateral.on{transform:none}
.lateral .lc{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--panel)}
.lateral .lc h3{margin:0;font-size:15px;flex:1}
.lateral .lb{padding:16px 18px;overflow-y:auto;flex:1}
.detalle{position:fixed;inset:16px;z-index:62;background:var(--bg);border:1px solid var(--line);border-radius:18px;display:none;flex-direction:column;box-shadow:var(--sombraAlta);overflow:hidden;max-width:1500px;margin:0 auto}
.detalle.on{display:flex}
.detalle .dc{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.detalle .db{padding:16px 20px;overflow-y:auto;flex:1}
.cerrar{background:none;border:0;font-size:24px;cursor:pointer;color:var(--tx2);line-height:1;padding:4px 8px}
.cerrar:hover{color:var(--tx)}
.fig{position:relative;height:340px}
.rango{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.rango input[type=date]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12.5px}
.hist td{text-align:center;font-size:12.5px}
.hist td.cur{outline:2px solid var(--acc);outline-offset:-2px;border-radius:6px}
/* formularios */
label.f{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:15px}
textarea.inp{min-height:70px;resize:vertical}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* chat */
.msg{margin-bottom:12px;padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.55}
.msg.u{background:color-mix(in srgb,var(--acc) 12%,transparent);margin-left:40px}
.msg.a{background:var(--panel);border:1px solid var(--line)}
.msg.a p{margin:0 0 8px}.msg.a ul{margin:4px 0 8px;padding-left:20px}
.estado{font-size:12px;color:var(--tx2);font-style:italic}
.progreso{display:grid;gap:6px;margin-top:10px}
.progreso div{font-size:12.5px;display:flex;gap:8px;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:80;font-size:13px;display:none}
.toast.on{display:block}
.meter{height:10px;border-radius:999px;background:var(--panel3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);border-radius:999px}
.senal{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px}
.s-ok{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.s-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.s-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.s-info{color:var(--c3);background:color-mix(in srgb,var(--c3) 12%,transparent)}
.banner{border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid}
.banner.info{background:color-mix(in srgb,var(--c3) 9%,var(--panel));border-color:color-mix(in srgb,var(--c3) 40%,transparent)}
.banner.warn{background:color-mix(in srgb,var(--warn) 9%,var(--panel));border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.banner .txt{flex:1 1 300px;font-size:13.5px}
.criterios{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.criterios span{font-size:12px;background:var(--panel2);border-radius:8px;padding:4px 9px;color:var(--tx2)}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filtros select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px}
.glos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.glos .caja p{-webkit-line-clamp:unset;display:block}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.lateral{transition:none}}
</style>
</head>
<body>
<header>
  <div class="cab">
    <h1><svg class="radar-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--acc)"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/><circle cx="16.5" cy="8.5" r="1.3" fill="currentColor"/></svg>RadarBolsa <small id="upd">cargando…</small></h1>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-t="mercado">Mercado</button>
      <button class="tab" data-t="oportunidades">Oportunidades</button>
      <button class="tab" data-t="cartera">Mi cartera</button>
    </nav>
    <form class="buscador" id="fBusca">
      <input id="qBusca" placeholder="Pregunta lo que quieras: ¿qué sector tiene mejor histórico tras esta caída?" autocomplete="off" aria-label="Pregunta a RadarBolsa">
      <button class="btn pri" type="submit">Preguntar</button>
    </form>
    <button class="btn ico" id="bAjustes" title="Presupuesto y tickets" aria-label="Ajustes">⚙</button>
    <button class="btn ico" id="bAyuda" title="Cómo leer la app" aria-label="Ayuda">?</button>
  </div>
</header>

<main>
  <section class="seccion on" id="s-mercado"></section>
  <section class="seccion" id="s-oportunidades"></section>
  <section class="seccion" id="s-cartera"></section>
</main>

<div class="velo" id="velo"></div>
<aside class="lateral" id="lateral" aria-live="polite"><div class="lc"><h3 id="latT"></h3><button class="cerrar" data-cerrar aria-label="Cerrar">×</button></div><div class="lb" id="latB"></div></aside>
<div class="detalle" id="detalle" role="dialog"><div class="dc" id="detC"></div><div class="db" id="detB"></div></div>
<div class="toast" id="toast"></div>

<script>
{
// ============================ utilidades ============================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const _cp = document.createElement('span');
const css = v => { if (!_cp.isConnected) { _cp.style.display='none'; document.body.appendChild(_cp); } _cp.style.color = `var(${v})`; return getComputedStyle(_cp).color; };
const fid = t => String(t).replace(/[^A-Za-z0-9_\-.~:@+]/g, '_');
const fname = t => String(t).replace(/[^A-Za-z0-9]/g, '_');
const hoyISO = () => new Date().toISOString().slice(0,10);
const sumaDias = (iso, d) => { const x = new Date(iso); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); };
const diasEntre = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const num = (v, d=2) => v==null || isNaN(v) ? '–' : Number(v).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur = v => v==null || isNaN(v) ? '–' : Number(v).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const pct = (v, d=1, flecha=true) => {
  if (v==null || isNaN(v)) return '<span class="mut">–</span>';
  const c = v>0 ? 'pos' : v<0 ? 'neg' : '';
  return `<span class="num ${c}">${flecha ? (v>0?'▲ ':v<0?'▼ ':'') : ''}${v>0?'+':''}${num(v,d)}%</span>`;
};
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 3200); };
const CONS = {strong_buy:'compra fuerte', buy:'comprar', hold:'mantener', underperform:'por debajo del mercado', sell:'vender', none:'—'};
const NIV = {verde:'Histórico favorable', ambar:'Histórico mixto', rojo:'Histórico desfavorable', gris:'Pocos precedentes', neutro:'En su nivel habitual'};
const badge = l => l ? `<span class="badge b-${l.nivel}" title="${esc(l.texto)}"><span class="dot" style="background:currentColor"></span>${NIV[l.nivel]||''}</span>` : '';
const ICO = {
  neg:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="12" height="9" rx="1.5"/><path d="M6 5V3h4v2"/></svg>',
  cae:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4l5 5 3-3 4 5"/><path d="M14 8v3h-3"/></svg>',
  rie:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2l6.5 11.5h-13z"/><path d="M8 7v3M8 12v.5"/></svg>',
  opo:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12l4-4 3 3 5-6"/><path d="M10 5h4v4"/></svg>',
  inv:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><path d="M4 12l8-8"/></svg>',
  dia:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3h10v7H8l-3 3v-3H3z"/></svg>',
  con:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5l3 3 7-7"/></svg>'
};

// ============================ estado ============================
let D = null, U = [], UX = {}, IDX = {}, FICHAS = {}, EXCL = {}, CART = {}, VERED = {}, AJ = null;
let db = null, sample = null, mcp = null;
const AJ_DEF = {personas:[{nombre:'Yo', presupuesto:40000},{nombre:'Pam', presupuesto:35000}], ticket_min:1000, ticket_max:2500, cuenta_pct:3};
const ajustes = () => ({...AJ_DEF, ...(AJ||{})});

const item = t => IDX[t] || null;
function nombreDe(t){ const i = item(t); if (i) return i.nombre; const u = UX[t]; return u ? u[1] : t; }
function descDe(t){ const i = item(t); if (i) return i.desc; const u = UX[t]; return u ? u[6] : null; }
function precioDe(t){ const i = item(t); if (i) return i.precio; const u = UX[t]; return u ? u[5] : null; }
function monedaDe(t){ const i = item(t); if (i) return i.moneda; const u = UX[t]; return u ? u[4] : ''; }

// ============================ carga ============================
async function cargar(){
  try {
    const [r1, r2] = await Promise.all([fetch('data/resumen.json'), fetch('data/universo.json')]);
    D = await r1.json(); U = r2.ok ? await r2.json() : [];
  } catch(e) { $('#s-mercado').innerHTML = '<div class="card vacio">Todavía no hay datos. Se cargan cada día laborable hacia las 11:50.</div>'; $('#upd').textContent=''; return; }
  U.forEach(u => UX[u[0]] = u);
  const m = D.mercado;
  [...m.indices, ...m.contexto, ...m.sectores, ...D.oportunidades, ...(D.cartera_extra||[])].forEach(i => IDX[i.ticker] = i);
  m.sectores.forEach(s => { if (s.ucits) IDX[s.ucits.ticker] = {...s.ucits, tipo:'ucits', sector:s.nombre, lectura:null, padre:s.ticker}; });
  $('#upd').textContent = `datos ${D.actualizado.slice(8,10)}/${D.actualizado.slice(5,7)} ${D.actualizado.slice(11)} · ${D.n_universo} empresas revisadas`;
  pintar();
  conectar();
}

async function conectar(){
  const c = window.claude;
  if (!c || !c.use) { pintar(); return; }
  c.use('sample').then(s => { sample = s; pintar(); });
  c.use('mcp').then(m => { mcp = m; });
  db = await c.use('db');
  if (!db) { pintar(); return; }
  const sub = (col, dest, cb) => db.collection(col).onSnapshot(snap => {
    for (const k in dest) delete dest[k];
    snap.docs.forEach(d => dest[d.id] = d.data());
    cb && cb(); pintar();
  }, e => console.warn(col, e));
  sub('fichas', FICHAS); sub('exclusiones', EXCL); sub('cartera', CART); sub('veredictos', VERED);
  db.doc('ajustes/general').onSnapshot(d => { AJ = d.exists ? d.data() : null; pintar(); }, () => {});
}

// ============================ piezas comunes ============================
function sparkline(s, color){
  if (!s || !s.d) return '';
  const p = s.d.slice(-63).map(x => x[1]).filter(x => x!=null); if (p.length<2) return '';
  const mn = Math.min(...p), mx = Math.max(...p), W = 200, H = 36;
  const pts = p.map((v,i) => `${(i/(p.length-1)*W).toFixed(1)},${(H-2-(v-mn)/(mx-mn||1)*(H-4)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}
const SERIE = {};
async function serie(t){ if (SERIE[t] !== undefined) return SERIE[t]; try { const r = await fetch(`data/series/${fname(t)}.json`); SERIE[t] = r.ok ? await r.json() : null; if (SERIE[t] && !SERIE[t].d) SERIE[t] = null; } catch(e) { SERIE[t] = null; } return SERIE[t]; }

function fichaHTML(t, opts={}){
  const f = FICHAS[fid(t)];
  if (!f) {
    if (!db || !sample) return `<div class="sinficha"><span>Sin análisis todavía.</span></div>`;
    return `<div class="sinficha"><span>Sin análisis todavía: pide a Claude el porqué de esta caída.</span><button class="btn sm pri" data-analizar="${esc(t)}">Analizar con Claude</button></div>`;
  }
  const caja = (k, tit, txt) => txt ? `<div class="caja k-${k}"><div class="t">${ICO[k]}${tit}</div><p>${esc(txt)}</p></div>` : '';
  const ex = f.conflicto_exclusion ? `<div class="aviso-ex">⚠ Choca con una de tus exclusiones: ${esc(f.conflicto_exclusion)}</div>` : '';
  const html = `<div class="ficha${opts.abierta?' abierta':''}">${ex}
    ${caja('neg', t==='_mercado'?'Qué está pasando':'Qué es y de dónde gana dinero', f.negocio)}
    ${caja('cae', 'Por qué ha caído', f.por_que_cae)}
    ${caja('rie', 'Riesgo real', f.riesgo)}
    ${caja('opo', 'Oportunidad real', f.oportunidad)}
    ${caja('inv', 'Qué invalidaría la tesis', f.invalida)}
    ${caja('dia', 'Abogado del diablo', f.abogado || f.abogado_del_diablo)}
    ${caja('con', 'Conclusión', f.conclusion)}</div>`;
  const fuentes = (f.fuentes||[]).filter(u => /^https?:\/\//.test(u)).slice(0,4).map(u => { let h=u; try{h=new URL(u).hostname.replace('www.','');}catch(e){} return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(h)}</a>`; }).join(' · ');
  return html + (opts.abierta ? '' : '<button class="ver-mas" data-vermas>Leer completo</button>') + (fuentes ? `<div class="hint" style="padding:0 16px 10px">Fuentes: ${fuentes}</div>` : '');
}
const fechaFicha = t => { const f = FICHAS[fid(t)]; return f ? `análisis ${f.fecha.slice(8,10)}/${f.fecha.slice(5,7)}` : ''; };

function ticket(i){
  const a = ajustes(), l = i.lectura || {}, mid = Math.round((a.ticket_min + a.ticket_max)/2/250)*250;
  if (esETF(i)) return l.nivel==='verde' ? a.ticket_max : mid;
  if (l.nivel==='verde' && (i.volatilidad||99) < 35) return mid;
  return a.ticket_min;
}
function excluido(t){
  const e = EXCL[fid(t)]; if (e && e.estado!=='reactivada') return e;
  const i = item(t), sec = i ? i.sector : (UX[t]||[])[2];
  return Object.values(EXCL).find(x => x.tipo==='sector_acciones' && x.estado!=='reactivada' && x.valor===sec && i && i.tipo==='accion') || null;
}

function barrasSectores(){
  const S = [...D.mercado.sectores].sort((a,b) => (a[metricaSect]??0)-(b[metricaSect]??0));
  const mx = Math.max(5, ...S.map(s => Math.abs(s[metricaSect]??0)));

    return `<div class="barra" data-det="${esc(s.ticker)}"><span>${esc(s.nombre)}</span><div class="pista"><div class="cero"></div><div class="r" style="${v<0?`right:50%;width:${w}%;background:var(--bad)`:`left:50%;width:${w}%;background:var(--acc)`}"></div></div><span class="num" style="text-align:right">${v>0?'+':''}${num(v,1)}%</span><span class="bd">${badge(s.lectura)}</span></div>`; }).join('');
}

let esquemaWeb = null;
async function herramientasWeb(){
  if (!mcp) return [];
  const t = [{name:'buscar_web', description:'Busca noticias y páginas recientes en la web. Devuelve resultados con título, URL y extracto. Úsala para saber por qué ha caído algo o qué ha pasado recientemente.',
    inputSchema:{type:'object', properties:{consulta:{type:'string', description:'Qué buscar, en inglés o español'}}, required:['consulta']},
    execute: async (inp, ctx) => {
      const q = String(inp.consulta||'');
      if (!esquemaWeb) { try { esquemaWeb = (await mcp.describeTool('Parallel Search','web_search')).inputSchema; } catch(e) {} }
      const arg = construirArg(esquemaWeb, q);
      try { const r = await mcp.callTool('Parallel Search','web_search', arg, {signal: ctx.signal}); return recorta(r.payload ?? r.content); }
      catch(e) {
        if (e.code==='server_not_connected' || e.code==='needs_reauth') throw new Error('El buscador web no está conectado: conecta "Parallel Search" en claude.ai → Ajustes → Conectores.');
        if (!esquemaWeb && e.code==='tool_error') { const r = await mcp.callTool('Parallel Search','web_search', {objective:q, search_queries:[q]}, {signal: ctx.signal}); return recorta(r.payload ?? r.content); }
        throw new Error(e.message || e.code);
      }
    }},
    {name:'leer_pagina', description:'Lee el contenido de una URL concreta (por ejemplo una noticia encontrada con buscar_web).',
    inputSchema:{type:'object', properties:{url:{type:'string'}}, required:['url']},
    execute: async (inp, ctx) => {
      let sch = null; try { sch = (await mcp.describeTool('Parallel Search','web_fetch')).inputSchema; } catch(e) {}
      const u = String(inp.url||''); let arg = {url:u};
      if (sch && sch.properties) { const p = Object.keys(sch.properties); if (p.includes('urls')) arg = {urls:[u]}; if (p.includes('objective')) arg.objective = 'Extraer lo relevante para inversión'; }
      const r = await mcp.callTool('Parallel Search','web_fetch', arg, {signal: ctx.signal}); return recorta(r.payload ?? r.content, 9000);
    }}];
  return t;
}
function construirArg(sch, q){
  if (!sch || !sch.properties) return {query: q};
  const out = {}, props = sch.properties, req = sch.required || Object.keys(props);
  for (const k of Object.keys(props)) {
    const p = props[k] || {};
    if (p.type==='string' && (req.includes(k) || /query|objective|q$/i.test(k))) out[k] = q;
    if (p.type==='array' && (req.includes(k) || /quer/i.test(k))) out[k] = [q];
  }
  return Object.keys(out).length ? out : {query: q};
}
function recorta(x, n=7000){ const s = typeof x==='string' ? x : JSON.stringify(x); return s.length>n ? s.slice(0,n)+'…' : s; }

function puntos(){
  const {s, r, desde, hasta} = detEstado; if (!s) return [];

  if (r && r!=='Máx') return s.d.slice(-N[r]);
  if (r==='Máx') return s.m.map(x => [x[0], x[1], null]);
  const d0 = desde || '1900-01-01', d1 = hasta || '2999-12-31';
  if (d0 >= s.d[0][0]) return s.d.filter(x => x[0]>=d0 && x[0]<=d1);

}

function tablaHist(i){

function fxHoy(){ const e = item('6E=F'); return e ? e.precio : null; }

function valorar(p){
  const ph = precioDe(p.ticker), mon = p.moneda || monedaDe(p.ticker);
  if (ph==null || !p.precio) return {valor:null};

  else if (mon && mon!=='EUR' && mon!=='USD') nota = 'sin ajuste de divisa';
  const valor = p.importe * f;
  return {valor, res: valor - p.importe, resPct: (f-1)*100, nota, ph};
}
function senales(p, v){

  const obj = p.objetivo ?? (esETF(i) ? 10 : 20), stop = p.stop ?? (esETF(i) ? -12 : -20);
  if (v.resPct >= obj) out.push(['s-ok', `Objetivo +${obj}% alcanzado: valora recoger beneficios`]);
  else if (descDe(p.ticker)!=null && descDe(p.ticker) >= 0 && v.resPct > 0) out.push(['s-info', 'Ha vuelto a su nivel habitual']);
  if (v.resPct <= stop) out.push(['s-bad', `Pérdida mayor de ${stop}%: revisa la tesis`]);
  if (dias >= 365) out.push(['s-warn', 'Más de 12 meses: plazo cumplido']);
  if (dias >= 180 && v.resPct < a.cuenta_pct * dias/365) out.push(['s-warn', `Rinde menos que el ${a.cuenta_pct}% de la cuenta`]);
  return out;
}

      <div><label class="f">Avisarme al perder (%)</label><input class="inp" type="number" id="pS" value="${p&&p.stop!=null?p.stop:''}" placeholder="-12 ETF · -20 acción"></div></div>
    <label class="f">Por qué lo compro (tesis)</label><textarea class="inp" id="pN" placeholder="Ej.: sector castigado con histórico favorable, horizonte 6-12 meses">${p?esc(p.nota||''):''}</textarea>
    <div style="margin-top:16px;display:flex;gap:8px"><button class="btn pri" id="pOk">${p?'Guardar':'Añadir'}</button><button class="btn" data-cerrar>Cancelar</button>${p?`<button class="btn ghost peligro" id="pDel" style="margin-left:auto">Borrar</button>`:''}</div>`);
  const info = () => { const t = $('#pT').value.trim(); const n = nombreDe(t), pr = precioDe(t), mo = monedaDe(t); $('#pInfo').innerHTML = pr!=null ? `${esc(n)} · último precio ${num(pr)} ${esc(mo)} · ${pct(descDe(t),1,false)} vs nivel habitual` : (t ? 'No está en el panel: añádelo igualmente y tendrá precio a partir de mañana.' : ''); $('#pMon').textContent = mo || 'moneda del producto'; };
  $('#pT').oninput = info; info();
  $('#pOk').onclick = async () => {
    const t = $('#pT').value.trim(), imp = Number($('#pI').value), fecha = $('#pF').value || hoyISO();
    if (!t || !imp) return toast('Indica producto e importe.');
    let precio = Number($('#pPr').value) || null;
    if (!precio) { const s = await serie(t); if (s) { for (const x of s.d) { if (x[0] > fecha) break; precio = x[1]; } } precio = precio || precioDe(t); }
    const mon = monedaDe(t) || null;
    const doc = {ticker:t, nombre:nombreDe(t), persona:$('#pP').value, importe:imp, fecha, precio, moneda:mon,
      fx_compra: mon==='USD' ? await fxEn(fecha) : null, objetivo: $('#pO').value==='' ? null : Number($('#pO').value), stop: $('#pS').value==='' ? null : Number($('#pS').value),
      nota:$('#pN').value.trim(), estado:'abierta'};
    try { await db.collection('cartera').doc(id || undefined).set(doc); cerrarTodo(); toast(p ? 'Guardado.' : 'Añadido a tu cartera.'); if (!item(t)) toast('Guardado. Tendrá datos a partir de mañana.'); } catch(e) { toast('No se pudo guardar: ' + (e.message||e.code)); }
  };
  const del = $('#pDel'); if (del) del.onclick = async () => { if (del.dataset.ok) { await db.collection('cartera').doc(id).delete(); cerrarTodo(); toast('Borrada.'); } else { del.textContent = '¿Seguro? Pulsa otra vez'; del.dataset.ok = 1; } };
}
function formVenta(id){
  const p = CART[id], v = valorar(p);
  lateral('Registrar venta: ' + p.nombre, `<label class="f">Fecha de venta</label><input class="inp" type="date" id="vF" value="${hoyISO()}">
    <label class="f">Importe recibido (€)</label><input class="inp" type="number" id="vI" step="1" value="${v.valor!=null?Math.round(v.valor):''}">
    <div class="hint">Prefijado con el valor calculado hoy; pon el importe real de Trade Republic.</div>
    <div style="margin-top:16px;display:flex;gap:8px"><button class="btn pri" id="vOk">Registrar</button><button class="btn" data-cerrar>Cancelar</button></div>`);
  $('#vOk').onclick = async () => { try { await db.collection('cartera').doc(id).set({...p, estado:'cerrada', fecha_venta:$('#vF').value, importe_venta:Number($('#vI').value)||null}); cerrarTodo(); toast('Venta registrada.'); } catch(e) { toast('No se pudo guardar.'); } };
}
async function revisarCartera(){
  const btn = $('#bRevisar'); btn.disabled = true; btn.textContent = 'Revisando…';
  $('#revProg').innerHTML = '<span class="estado">Claude está revisando cada posición (puede tardar 1-2 minutos)…</span>';
  const pos = Object.entries(CART).filter(([,p]) => p.estado!=='cerrada').map(([id,p]) => { const v = valorar(p), i = item(p.ticker); return {id, producto:p.nombre, ticker:p.ticker, persona:p.persona, compra:p.fecha, dias:diasEntre(p.fecha,hoyISO()), importe:p.importe, resultado_pct: v.resPct!=null?Math.round(v.resPct*10)/10:null, tesis:p.nota, datos: i ? resumenItem(i,false) : null, analisis_guardado: FICHAS[fid(p.ticker)]?.conclusion || null}; });
  const prompt = `Eres el analista de RadarBolsa. ${PERFIL}
Revisa cada posición abierta y di si conviene mantener, vigilar, vender una parte o vender, pensando en su horizonte (1-12 meses), si la tesis sigue viva, si ya ha recuperado su nivel habitual y si rinde más que el 3% de la cuenta. ${mcp?'Si una posición se ha movido mucho, busca en la web la causa (máximo 3 búsquedas en total).':''} Sé honesto: no es una orden, es una lectura.
Posiciones: ${JSON.stringify(pos)}
Responde SOLO con un array JSON: [{"id":"...","veredicto":"mantener|vigilar|vender_parte|vender","motivo":"1-2 frases"}]`;
  try {
    const herr = await herramientasWeb();
    const r = await sample.json(prompt, herr.length ? {tools: herr} : {cache:false});
    for (const x of (Array.isArray(r) ? r : [])) if (x && CART[x.id]) await db.collection('veredictos').doc(x.id).set({veredicto:String(x.veredicto||''), motivo:String(x.motivo||''), fecha:hoyISO()});
    toast('Revisión guardada.');
  } catch(e) { toast(msgError(e)); }
  btn.disabled = false; btn.textContent = 'Revisar mi cartera con Claude'; $('#revProg').innerHTML = '';
}

// ============================ ajustes y ayuda ============================
$('#bAjustes').onclick = () => {
  const a = ajustes();
  lateral('Presupuesto y tickets', `<p class="hint">Se usan para el ticket orientativo de cada oportunidad y para el seguimiento de tu cartera.</p>
    ${a.personas.map((x,k) => `<div class="fila"><div><label class="f">Persona ${k+1}</label><input class="inp" id="aN${k}" value="${esc(x.nombre)}"></div><div><label class="f">Presupuesto (€)</label><input class="inp" type="number" id="aP${k}" value="${x.presupuesto}"></div></div>`).join('')}
    <div class="fila"><div><label class="f">Ticket mínimo (€)</label><input class="inp" type="number" id="aMin" value="${a.ticket_min}"></div><div><label class="f">Ticket máximo (€)</label><input class="inp" type="number" id="aMax" value="${a.ticket_max}"></div></div>
    <label class="f">Rentabilidad de la cuenta remunerada (%)</label><input class="inp" type="number" step="0.1" id="aC" value="${a.cuenta_pct}">
    <div style="margin-top:16px"><button class="btn pri" id="aOk" ${db?'':'disabled'}>Guardar</button></div>`);
  $('#aOk').onclick = async () => { const doc = {personas: a.personas.map((x,k) => ({nombre:$('#aN'+k).value.trim()||x.nombre, presupuesto:Number($('#aP'+k).value)||0})), ticket_min:Number($('#aMin').value)||1000, ticket_max:Number($('#aMax').value)||2500, cuenta_pct:Number($('#aC').value)||0};
    try { await db.doc('ajustes/general').set(doc); cerrarTodo(); toast('Guardado.'); } catch(e) { toast('No se pudo guardar.'); } };
};
$('#bAyuda').onclick = () => lateral('Cómo leer RadarBolsa', `<div class="glos">
  <div class="caja k-neg"><div class="t">${ICO.neg}Nivel habitual</div><p>El precio que el producto ha superado solo el 20% de los días del último año (percentil 80). Es una referencia más estable que el máximo, que es casi imposible de acertar. "−12% vs nivel habitual" significa que está un 12% por debajo de ese precio.</p></div>
  <div class="caja k-opo"><div class="t">${ICO.opo}Histórico favorable / mixto</div><p>Desde 2000, cada vez que el producto estuvo así de por debajo de su nivel habitual, ¿estaba más alto 6 meses después? Favorable: en el 70% de los casos o más <i>y</i> mejor que comprar un día cualquiera. Mixto: entre el 55% y el 70%, o bueno pero no mejor que comprar cualquier día.</p></div>
  <div class="caja k-rie"><div class="t">${ICO.rie}Mediana y escenario malo</div><p>Mediana: el resultado típico. Escenario malo: el 10% de los casos fue igual o peor. Es lo que conviene poder aguantar.</p></div>
  <div class="caja k-inv"><div class="t">${ICO.inv}No es una predicción</div><p>Es lo que pasó antes. En empresas sueltas el futuro puede ser muy distinto (cambio de CEO, un producto que deja de vender…). Por eso cada tarjeta lleva el análisis cualitativo.</p></div>
  <div class="caja k-dia"><div class="t">${ICO.dia}Volatilidad</div><p>Cuánto se mueve en un año normal. Un índice ronda el 15–20%; una tecnológica suelta, el 40–60%. A más volatilidad, más normal es una caída grande.</p></div>
  <div class="caja k-con"><div class="t">${ICO.con}Ticket orientativo</div><p>Sugerencia según tu rango (1.000–2.500 €): más para ETF con histórico favorable, menos para empresas sueltas o volátiles. Ajústalo en ⚙.</p></div>
  <div class="caja k-neg"><div class="t">${ICO.neg}¿Por qué dos productos por sector?</div><p>Los ETF sectoriales de EE. UU. tienen historia desde 1998 (mejor estadística), pero desde la UE no se pueden comprar. Al lado tienes el ETF europeo (UCITS) equivalente; verifica el ISIN en Trade Republic.</p></div>
  <div class="caja k-cae"><div class="t">${ICO.cae}Horarios y fiscalidad</div><p>ETF europeos: compra entre 9:30 y 17:30. Acciones de EE. UU.: a partir de las 15:30. Los fondos indexados permiten traspasos sin tributar; los ETF y las acciones tributan al vender con ganancia.</p></div>
  </div><p class="hint" style="margin-top:14px">Datos de Yahoo Finance, actualizados de lunes a viernes hacia las 11:50. Las lecturas históricas y los análisis de Claude no son asesoramiento financiero.</p>`);

cargar();
}
</script>
