<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadarBolsa</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#f4f3f0; --surface-1:#fcfcfb; --surface-2:#f0efec; --border:#e2e0da;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7a7873;
  --series-1:#2a78d6; --neg:#c23434; --pos:#1f7a1f; --neutral:#f0efec;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --grid:#ebe9e4;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#121211; --surface-1:#1a1a19; --surface-2:#242422; --border:#33332f;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;
    --series-1:#3987e5; --neg:#e66767; --pos:#3fbf3f; --neutral:#383835;
    --grid:#2a2a27;
  }
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text-primary)}
header{padding:16px 20px 0;max-width:1200px;margin:auto}
h1{font-size:22px;margin:0}
.sub{color:var(--text-secondary);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px;border-bottom:1px solid var(--border)}
nav button{background:none;border:0;padding:8px 12px;font:inherit;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--text-primary);border-bottom-color:var(--series-1);font-weight:600}
main{max-width:1200px;margin:auto;padding:16px 20px 40px}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:14px;margin:12px 0 6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--text-secondary)}
.tile .v{font-size:20px;font-weight:600}
.tile .d{font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:12px;color:var(--text-secondary);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface-1)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface-1)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--text-muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--text-primary);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.alert{border-left:4px solid var(--critical)}
.alert li{margin-bottom:6px}
.note{font-size:12px;color:var(--text-muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.seg button,select{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);border-radius:6px;cursor:pointer}
.seg button.on{background:var(--series-1);border-color:var(--series-1);color:#fff}
.chartbox{position:relative;height:300px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:10;padding:20px 10px}
#modal .box{background:var(--bg);border-radius:12px;max-width:1000px;width:100%;padding:16px 18px;position:relative}
#modal .close{position:absolute;right:12px;top:10px;font-size:22px;background:none;border:0;color:var(--text-primary);cursor:pointer}
.tramo{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.tramo .chk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;border:2px solid var(--border)}
.tramo.on .chk{background:var(--good);border-color:var(--good);color:#fff}
.bar{height:10px;background:var(--surface-2);border-radius:99px;position:relative;margin:10px 0 18px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--series-1)}
.bar .mk{position:absolute;top:-4px;width:2px;height:18px;background:var(--text-secondary)}
.bar .mk span{position:absolute;top:19px;left:-14px;font-size:11px;color:var(--text-secondary)}
.ficha{border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.ficha p{margin:4px 0}
.ficha .lbl{font-weight:600}
.br td.cur{outline:2px solid var(--series-1);outline-offset:-2px}
footer{max-width:1200px;margin:auto;padding:0 20px 30px;font-size:12px;color:var(--text-muted)}
</style>
</head>
<body>
<header>
  <h1>RadarBolsa</h1>
  <div class="sub" id="upd">Cargando datos…</div>
  <nav id="tabs">
    <button data-t="resumen" class="on">Resumen</button>
    <button data-t="indices">Índices</button>
    <button data-t="sectores">Sectores</button>
    <button data-t="empresas">Empresas</button>
    <button data-t="analisis">Análisis</button>
    <button data-t="ayuda">Cómo leerlo</button>
  </nav>
</header>
<main id="main"></main>
<div id="modal"><div class="box"><button class="close" aria-label="Cerrar">×</button><div id="mbody"></div></div></div>
<footer>Datos: Yahoo Finance (pueden tener retraso o errores puntuales). Las "lecturas históricas" describen lo que pasó en el pasado tras caídas similares; no son una predicción ni una recomendación de inversión.</footer>

<script>
const $ = s => document.querySelector(s);
let D = null, A = null, tab = 'resumen', charts = [];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NIV = {verde:['var(--good)','Histórico favorable'], ambar:['var(--warning)','Histórico mixto'],
             rojo:['var(--critical)','Histórico desfavorable'], gris:['var(--text-muted)','Pocos precedentes'],
             neutro:['var(--border)','Sin caída relevante']};

function pct(v, dec=1){
  if(v===null||v===undefined) return '<span class="mut">–</span>';
  const c = v>0?'pos':(v<0?'neg':''), a = v>0?'▲':(v<0?'▼':'');
  return `<span class="${c}">${a} ${v>0?'+':''}${v.toFixed(dec)}%</span>`;
}
const num = (v,d=2) => v===null||v===undefined ? '–' : v.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const badge = l => { if(!l) return ''; const [c,t]=NIV[l.nivel]||NIV.neutro; return `<span class="badge" title="${l.texto}"><span class="dot" style="background:${c}"></span>${t}</span>`; };
const fname = t => t.replace(/[^A-Za-z0-9]/g,'_');
const byT = t => D.elementos.find(e=>e.ticker===t);

async function load(){
  try{
    const r = await fetch('data/resumen.json?'+Date.now()); D = await r.json();
  }catch(e){ $('#main').innerHTML='<div class="card">Todavía no hay datos. Se generan en la primera ejecución diaria.</div>'; $('#upd').textContent=''; return; }
  try{ const r = await fetch('analisis/ultimo.json?'+Date.now()); if(r.ok) A = await r.json(); }catch(e){}
  $('#upd').textContent = `Actualizado: ${D.actualizado} (hora de Madrid)` + (D.errores.length?` · sin datos: ${D.errores.join(', ')}`:'');
  render();
}

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); tab=b.dataset.t; render();
});
$('#modal .close').onclick = ()=>{ $('#modal').style.display='none'; };
$('#modal').onclick = e=>{ if(e.target.id==='modal') $('#modal').style.display='none'; };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('#modal').style.display='none'; });

function killCharts(){ charts.forEach(c=>c.destroy()); charts=[]; }

function render(){
  killCharts();
  const m = $('#main');
  if(tab==='resumen') m.innerHTML = vResumen();
  if(tab==='indices') m.innerHTML = vTabla('indice','Índices de referencia', 'La columna "Comprable" indica el ETF europeo equivalente. Pulsa una fila para ver gráficos y estadísticas.');
  if(tab==='sectores') { m.innerHTML = vSectores(); drawRanking(); }
  if(tab==='empresas') m.innerHTML = vEmpresas();
  if(tab==='analisis') m.innerHTML = vAnalisis();
  if(tab==='ayuda') m.innerHTML = vAyuda();
  bindTables();
}

// ---------------- Resumen ----------------
function vResumen(){
  let h = '';
  if(D.alertas.length){
    h += `<div class="card alert"><h2>⚠ Alertas activas (${D.alertas.length})</h2><ul>`;
    D.alertas.forEach(a=>{ const nueva = D.alertas_nuevas.includes(a.clave);
      h += `<li><a href="#" data-det="${a.ticker}"><b>${a.texto}</b></a>${nueva?' <span class="badge">nueva hoy</span>':''}<br><span class="note">${a.lectura||''}</span></li>`; });
    h += '</ul></div>';
  } else h += '<div class="card"><h2>Sin alertas</h2><span class="note">Ningún índice, sector o empresa supera hoy los umbrales configurados.</span></div>';

  h += '<div class="grid g2">' + vTramos();
  h += '<div class="card"><h2>Contexto de mercado</h2><div class="tiles">';
  D.elementos.filter(e=>e.tipo==='contexto').forEach(e=>{
    h += `<div class="tile"><div class="k">${e.nombre}</div><div class="v">${num(e.precio, e.precio<10?4:2)}</div><div class="d">1 día ${pct(e.var_1d)} · 1 mes ${pct(e.var_1m)}</div></div>`; });
  h += '</div><p class="note">VIX: por debajo de 15 el mercado está tranquilo; por encima de 25, nervioso; por encima de 35, en pánico. Los momentos de pánico han sido históricamente buenos puntos de entrada a largo plazo, pero no avisan de cuándo acaba la caída.</p></div></div>';

  const idx = D.elementos.filter(e=>e.tipo==='indice');
  h += `<div class="card"><h2>Índices</h2>${tabla(idx, false)}</div>`;

  const cand = D.elementos.filter(e=>e.tipo==='sector'||e.tipo==='empresa').sort((a,b)=>a.caida_max52-b.caida_max52).slice(0,10);
  h += `<div class="card"><h2>Lo que más ha caído desde su máximo de 52 semanas</h2>${tabla(cand, false, true)}</div>`;
  const cand2 = D.elementos.filter(e=>e.tipo==='sector'||e.tipo==='empresa').sort((a,b)=>(a.var_5d??0)-(b.var_5d??0)).slice(0,8);
  h += `<div class="card"><h2>Lo que más ha caído en la última semana (5 sesiones)</h2>${tabla(cand2, false, true)}</div>`;
  return h;
}

function vTramos(){
  const t = D.tramos; if(!t) return '<div class="card">Plan por tramos: falta la referencia.</div>';
  const dd = t.caida_actual, maxD = Math.min(-35, ...t.niveles.map(n=>n.caida-5));
  const w = Math.min(100, Math.max(0, dd/maxD*100));
  let h = `<div class="card"><h2>Plan por tramos · ${t.nombre}</h2>
  <div class="sub">Caída actual desde su máximo de 52 semanas: <b>${pct(dd)}</b> · precio ${num(t.precio)} · máximo ${num(t.max_52s)}</div>
  <div class="bar"><div class="fill" style="width:${w}%"></div>`;
  t.niveles.forEach(n=>{ h+=`<div class="mk" style="left:${n.caida/maxD*100}%"><span>${n.caida}%</span></div>`; });
  h += '</div>';
  let acum = 0;
  t.niveles.forEach(n=>{ if(n.activado) acum+=n.importe;
    h += `<div class="tramo ${n.activado?'on':''}"><div class="chk">${n.activado?'✓':''}</div>
      <div style="flex:1">Tramo a <b>${n.caida}%</b> · ${n.peso}% del capital = <b>${num(n.importe,0)} €</b><br><span class="note">se activa con el ETF por debajo de ${num(n.precio_objetivo)} €</span></div>
      <div>${n.activado?'<b>Activado</b>':'<span class="mut">Pendiente</span>'}</div></div>`; });
  h += `<p class="note">Según este plan, importe acumulado que tocaría haber invertido a este nivel de caída: <b>${num(acum,0)} € de ${num(t.capital,0)} €</b>. Es una regla para no tener que adivinar el suelo; la decisión final es tuya. Se edita en <code>config/universo.yaml</code>.</p></div>`;
  return h;
}

// ---------------- Tablas ----------------
function tabla(items, sortable=true, conTipo=false){
  const cols = [['nombre','Nombre'],['precio','Precio'],['var_1d','1 día'],['var_5d','5 días'],['var_1m','1 mes'],['var_3m','3 meses'],['var_ytd','Año'],['var_1a','1 año'],['caida_max52','Desde máx. 52s'],['lectura','Lectura histórica']];
  let h = `<div class="tw"><table data-sort="${sortable?1:0}"><thead><tr>`;
  cols.forEach(([k,l])=>h+=`<th data-k="${k}">${l}</th>`);
  h += '</tr></thead><tbody>';
  items.forEach(e=>{
    const sub = conTipo ? `<br><span class="note">${e.tipo==='sector'?'Sector':(e.sector||'')}</span>` : (e.tipo==='empresa'?`<br><span class="note">${e.sector||''}</span>`:'');
    h += `<tr class="click" data-det="${e.ticker}"><td><b>${e.nombre}</b> <span class="mut">${e.ticker}</span>${sub}</td>
      <td>${num(e.precio, e.precio<10?4:2)} <span class="mut">${e.moneda}</span>${e.en_sesion?'':`<br><span class="note">cierre ${e.fecha.slice(5)}</span>`}</td>
      <td>${pct(e.var_1d)}</td><td>${pct(e.var_5d)}</td><td>${pct(e.var_1m)}</td><td>${pct(e.var_3m)}</td><td>${pct(e.var_ytd)}</td><td>${pct(e.var_1a)}</td>
      <td><b>${pct(e.caida_max52)}</b></td><td>${badge(e.lectura)}</td></tr>`;
  });
  return h + '</tbody></table></div>';
}

function bindTables(){
  document.querySelectorAll('[data-det]').forEach(el=>el.onclick=(ev)=>{ ev.preventDefault(); detalle(el.dataset.det); });
  document.querySelectorAll('table[data-sort="1"] th').forEach(th=>th.onclick=()=>{
    const k = th.dataset.k; if(!k||k==='lectura') return;
    const s = window._sort, dir = s && s.k===k && s.dir==='asc' ? 'desc' : 'asc';
    window._sort = {k, dir}; render();
  });
}
function ordenar(items){
  const s = window._sort; if(!s) return items;
  return [...items].sort((a,b)=>{ let x=a[s.k], y=b[s.k]; if(typeof x==='string') return s.dir==='asc'?x.localeCompare(y):y.localeCompare(x);
    x=x??-1e9; y=y??-1e9; return s.dir==='asc'?x-y:y-x; });
}

function vTabla(tipo, titulo, nota){
  const items = ordenar(D.elementos.filter(e=>e.tipo===tipo));
  let h = `<div class="card"><h2>${titulo}</h2><p class="note">${nota} Pulsa en una cabecera para ordenar.</p>${tabla(items)}`;
  if(tipo==='indice'){
    h += '<h3>Producto comprable en Europa</h3><div class="tw"><table><thead><tr><th>Índice</th><th style="text-align:left">ETF UCITS</th><th style="text-align:left">ISIN</th></tr></thead><tbody>';
    items.forEach(e=>h+=`<tr><td>${e.nombre}</td><td style="text-align:left">${e.comprable||'–'}</td><td style="text-align:left">${e.isin||'<span class="mut">por verificar</span>'}</td></tr>`);
    h += '</tbody></table></div><p class="note">Verifica siempre el ISIN en Trade Republic antes de comprar.</p>';
  }
  return h + '</div>';
}

// ---------------- Sectores ----------------
let rankMetric = 'caida_max52';
function vSectores(){
  const items = ordenar(D.elementos.filter(e=>e.tipo==='sector'));
  const opts = [['caida_max52','Desde máx. 52s'],['var_5d','5 días'],['var_1m','1 mes'],['var_3m','3 meses'],['var_1a','1 año']];
  let h = `<div class="card"><h2>Ranking de sectores</h2><div class="row seg" id="rk">${opts.map(([k,l])=>`<button data-m="${k}" class="${k===rankMetric?'on':''}">${l}</button>`).join('')}</div>
    <div class="chartbox" style="height:${items.length*28+40}px"><canvas id="cRank"></canvas></div>
    <p class="note">Datos de los ETF sectoriales de EE. UU. (más historia, estadística más robusta). Al pulsar un sector verás también su equivalente comprable en Europa.</p></div>`;
  h += `<div class="card"><h2>Sectores</h2>${tabla(items)}</div>`;
  h += '<div class="card"><h2>Producto comprable en Europa (versión mundial)</h2><div class="tw"><table><thead><tr><th>Sector</th><th style="text-align:left">ETF UCITS</th><th>Ticker</th><th style="text-align:left">ISIN</th><th>1 mes</th><th>Desde máx. 52s</th></tr></thead><tbody>';
  items.forEach(e=>{ const u=e.ucits; h+=`<tr><td>${e.nombre}</td><td style="text-align:left">${u?u.comprable:'–'}</td><td>${u?u.ticker:'–'}</td><td style="text-align:left">${u&&u.isin?u.isin:'<span class="mut">por verificar</span>'}</td><td>${u?pct(u.var_1m):'–'}</td><td>${u?pct(u.caida_max52):'–'}</td></tr>`; });
  h += '</tbody></table></div><p class="note">El ETF europeo es de ámbito mundial (no solo EE. UU.), así que sus cifras no coinciden exactamente con las del sector de EE. UU. Verifica el ISIN en Trade Republic antes de comprar.</p></div>';
  return h;
}
function drawRanking(){
  document.querySelectorAll('#rk button').forEach(b=>b.onclick=()=>{ rankMetric=b.dataset.m; render(); });
  const items = D.elementos.filter(e=>e.tipo==='sector').sort((a,b)=>(a[rankMetric]??0)-(b[rankMetric]??0));
  const vals = items.map(e=>e[rankMetric]);
  charts.push(new Chart($('#cRank'), {type:'bar',
    data:{labels:items.map(e=>e.nombre), datasets:[{data:vals, backgroundColor:vals.map(v=>v<0?css('--neg'):css('--series-1')), borderRadius:4, barThickness:16}]},
    options:{indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.raw>0?'+':''}${c.raw.toFixed(1)}%`}}},
      scales:{x:{grid:{color:css('--grid')}, ticks:{color:css('--text-secondary'), callback:v=>v+'%'}}, y:{grid:{display:false}, ticks:{color:css('--text-primary')}}},
      onClick:(e,els)=>{ if(els.length) detalle(items[els[0].index].ticker); }}}));
}

// ---------------- Empresas ----------------
let filtroSector = '';
function vEmpresas(){
  const secs = [...new Set(D.elementos.filter(e=>e.tipo==='empresa').map(e=>e.sector))];
  let items = D.elementos.filter(e=>e.tipo==='empresa' && (!filtroSector || e.sector===filtroSector));
  items = ordenar(items);
  setTimeout(()=>{ const s=$('#fsec'); if(s) s.onchange=()=>{ filtroSector=s.value; render(); }; });
  return `<div class="card"><h2>Empresas vigiladas</h2><div class="row"><label>Sector: <select id="fsec"><option value="">Todos</option>${secs.map(s=>`<option ${s===filtroSector?'selected':''}>${s}</option>`).join('')}</select></label></div>
  <p class="note">Una empresa suelta concentra el riesgo: su estadística histórica es menos fiable que la de un índice o un sector. Úsala junto con la ficha de análisis.</p>${tabla(items)}</div>`;
}

// ---------------- Análisis ----------------
function fichaHTML(f){
  const campo = (l,v)=> v?`<p><span class="lbl">${l}:</span> ${v}</p>`:'';
  return `<div class="ficha"><h3>${f.nombre} <span class="mut">${f.ticker||''}</span></h3>
    ${campo('Qué es y de dónde gana dinero', f.negocio)}${campo('Por qué ha caído', f.por_que_cae)}
    ${campo('Riesgo real', f.riesgo)}${campo('Oportunidad real', f.oportunidad)}
    ${campo('Qué invalidaría la tesis', f.invalida)}${campo('Abogado del diablo', f.abogado_diablo)}
    ${campo('Conclusión', f.conclusion)}${f.fuentes&&f.fuentes.length?`<p class="note">Fuentes: ${f.fuentes.map(u=>`<a href="${u}" target="_blank" rel="noopener">${new URL(u).hostname}</a>`).join(' · ')}</p>`:''}</div>`;
}
function vAnalisis(){
  if(!A) return '<div class="card"><h2>Análisis cualitativo</h2><p>Aún no hay análisis. Se genera cada lunes (y cuando lo pidas) con Claude.</p></div>';
  let h = `<div class="card"><h2>Análisis cualitativo · ${A.fecha}</h2>${A.contexto?`<p>${A.contexto}</p>`:''}`;
  (A.fichas||[]).forEach(f=>h+=fichaHTML(f));
  return h + '<p class="note">Elaborado por Claude a partir de noticias públicas y de los datos del panel. Es un análisis para ayudarte a pensar, no una recomendación de inversión.</p></div>';
}

// ---------------- Detalle ----------------
let serieCache = {};
async function serie(t){ if(serieCache[t]) return serieCache[t]; const r = await fetch(`data/series/${fname(t)}.json`); serieCache[t]=await r.json(); return serieCache[t]; }

async function detalle(t, vista='1a'){
  const e = byT(t); if(!e) return;
  $('#modal').style.display='flex';
  const s = await serie(t);
  let h = `<h2 style="margin:0 30px 4px 0">${e.nombre} <span class="mut">${e.ticker}</span></h2>
    <div class="sub">${e.tipo==='empresa'?e.sector:(e.tipo==='sector'?'Sector (ETF de EE. UU.)':'Índice')} · último dato ${e.fecha}${e.en_sesion?' (en sesión)':''} · historia desde ${e.historia_desde}</div>`;
  if(e.comprable) h += `<p>Comprable en Europa: <b>${e.comprable}</b> ${e.isin?`· ISIN ${e.isin}`:''}</p>`;
  h += `<div class="tiles" style="margin:10px 0">
    <div class="tile"><div class="k">Precio</div><div class="v">${num(e.precio)}</div><div class="d mut">${e.moneda}</div></div>
    <div class="tile"><div class="k">Desde máx. 52 semanas</div><div class="v">${pct(e.caida_max52)}</div><div class="d mut">máx. ${num(e.max_52s)}</div></div>
    <div class="tile"><div class="k">1 mes</div><div class="v">${pct(e.var_1m)}</div></div>
    <div class="tile"><div class="k">1 año</div><div class="v">${pct(e.var_1a)}</div></div>
    <div class="tile"><div class="k">Volatilidad anual</div><div class="v">${e.volatilidad??'–'}%</div><div class="d mut">cuánto se mueve normalmente</div></div></div>`;
  if(e.lectura) h += `<div class="card"><b>${badge(e.lectura)}</b> ${e.lectura.texto}</div>`;
  if(e.ucits){ const u=e.ucits; h += `<div class="card"><b>Equivalente comprable:</b> ${u.comprable} (${u.ticker}${u.isin?' · ISIN '+u.isin:''}) · ${num(u.precio)} ${u.moneda} · 1 mes ${pct(u.var_1m)} · desde máx. 52s ${pct(u.caida_max52)} · <a href="#" id="verU">ver su gráfico</a></div>`; }

  const vistas = [['1a','1 año (diario)'],['1m','1 mes (diario)'],['10a','10 años (mensual)'],['sem','Última semana']];
  h += `<div class="card"><div class="row seg" id="vs">${vistas.map(([k,l])=>`<button data-v="${k}" class="${k===vista?'on':''}">${l}</button>`).join('')}
    <button id="csv" style="margin-left:auto">Descargar CSV</button></div><div class="chartbox"><canvas id="cDet"></canvas></div><div id="tdet" class="tw" style="max-height:260px;overflow-y:auto;margin-top:10px"></div></div>`;

  if(e.tasas){
    const T = e.tasas, cur = e.lectura?.usado ?? e.lectura?.tramo;
    h += `<div class="card"><h2>¿Qué pasó en el pasado tras caídas parecidas?</h2>
      <p class="note">Cada celda: % de veces que el precio estaba más alto pasado ese plazo · mediana de la variación · (número de casos). Un "caso" es cada vez que cayó ese % desde su máximo de 52 semanas, contando cada crisis una sola vez. Con menos de ${D.metodo.min_casos} casos, la cifra no es fiable.</p>
      <div class="tw"><table class="br"><thead><tr><th>Caída desde máx.</th><th>1 mes</th><th>3 meses</th><th>6 meses</th><th>12 meses</th><th>Último caso</th></tr></thead><tbody>`;
    D.metodo.umbrales.forEach(u=>{ const r=T[u];
      h += `<tr><td>≥ ${u}%</td>` + ['1m','3m','6m','12m'].map(k=>{ const c=r[k];
        if(!c||!c.n) return `<td class="mut ${u==cur&&k==='6m'?'cur':''}">–</td>`;
        return `<td class="${u==cur&&k==='6m'?'cur':''} ${c.n<D.metodo.min_casos?'mut':''}"><b>${c.pct_sube}%</b> · ${c.mediana>0?'+':''}${c.mediana}% <span class="mut">(${c.n})</span></td>`; }).join('') + `<td>${r.ultimo||'–'}</td></tr>`; });
    const b = T.cualquier_dia;
    h += `<tr><td><i>Cualquier día</i></td>${['1m','3m','6m','12m'].map(k=>b[k]?`<td><i>${b[k].pct_sube}% · ${b[k].mediana>0?'+':''}${b[k].mediana}%</i></td>`:'<td>–</td>').join('')}<td></td></tr>`;
    h += '</tbody></table></div><p class="note">La fila "Cualquier día" es la referencia: si comprar tras una caída no mejora claramente esa cifra, la caída por sí sola no es una ventaja.</p></div>';
  }
  const f = A && (A.fichas||[]).find(x=>x.ticker===t);
  if(f) h += `<div class="card"><h2>Análisis (${A.fecha})</h2>${fichaHTML(f)}</div>`;
  $('#mbody').innerHTML = h;
  $('#modal').scrollTop = 0;
  document.querySelectorAll('#vs button[data-v]').forEach(b=>b.onclick=()=>pintar(s, b.dataset.v, e));
  $('#csv').onclick = ()=>csv(s, e);
  if($('#verU')) $('#verU').onclick = async ev=>{ ev.preventDefault(); const su = await serie(e.ucits.ticker); pintar(su, vista, {...e, nombre:e.ucits.comprable}); };
  pintar(s, vista, e);
}

let detChart = null;
function pintar(s, v, e){
  document.querySelectorAll('#vs button[data-v]').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  if(detChart){ detChart.destroy(); detChart=null; }
  let pts, labels, vals, tipo='line';
  if(v==='10a'){ pts = s.mensual; }
  else if(v==='1m'){ pts = s.diario.slice(-22); }
  else if(v==='sem'){ pts = s.diario.slice(-6); }
  else pts = s.diario.slice(-253);
  labels = pts.map(p=>p[0]); vals = pts.map(p=>p[1]);
  const chg = vals.map((x,i)=> i? (x/vals[i-1]-1)*100 : null);
  let data;
  if(v==='sem'){
    tipo='bar'; labels = labels.slice(1); const c = chg.slice(1);
    data = {labels, datasets:[{data:c, backgroundColor:c.map(x=>x<0?css('--neg'):css('--series-1')), borderRadius:4, barThickness:28}]};
  } else {
    data = {labels, datasets:[{data:vals, borderColor:css('--series-1'), borderWidth:2, pointRadius:0, pointHoverRadius:5, tension:0.1, fill:false}]};
  }
  detChart = new Chart($('#cDet'), {type:tipo, data, options:{maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
    plugins:{legend:{display:false}, title:{display:true, text: v==='sem'?`${e.nombre} · variación diaria (%)`:`${e.nombre} · precio`, color:css('--text-primary'), align:'start'},
      tooltip:{callbacks:{label:c=> v==='sem' ? `${c.raw>0?'+':''}${c.raw.toFixed(2)}%` : `${num(c.raw)}${chg[c.dataIndex]!==null?`  (${chg[c.dataIndex]>0?'+':''}${chg[c.dataIndex].toFixed(2)}%)`:''}`}}},
    scales:{x:{grid:{display:false}, ticks:{color:css('--text-secondary'), maxTicksLimit:8, maxRotation:0}},
            y:{grid:{color:css('--grid')}, ticks:{color:css('--text-secondary'), callback:x=> v==='sem'?x+'%':num(x,0)}}}}});
  // tabla de valores (más reciente arriba)
  let t = `<table><thead><tr><th>${v==='10a'?'Mes':'Fecha'}</th><th>Cierre</th><th>Variación</th></tr></thead><tbody>`;
  for(let i=pts.length-1;i>=0;i--) t += `<tr><td>${pts[i][0]}</td><td>${num(pts[i][1])}</td><td>${pct(chg[i],2)}</td></tr>`;
  $('#tdet').innerHTML = t + '</tbody></table>';
}

function csv(s, e){
  const rows = ['fecha;cierre', ...s.diario.map(p=>`${p[0]};${String(p[1]).replace('.',',')}`)];
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download = `${fname(e.ticker)}_diario.csv`; a.click();
}

// ---------------- Ayuda ----------------
function vAyuda(){
  return `<div class="card"><h2>Cómo leer el panel</h2>
  <h3>Caída desde máximo de 52 semanas</h3><p>Cuánto está por debajo del precio más alto del último año. Es la medida principal del panel: indica si algo está "de rebajas" respecto a su propio pasado reciente.</p>
  <h3>Lectura histórica (el semáforo)</h3><p>Mira todas las veces desde 1990 (o desde que existe el producto) en que cayó un porcentaje parecido y cuenta en cuántas estaba más alto 6 meses después. Verde: 70% o más de los casos <i>y</i> mejor que comprar un día cualquiera. Ámbar: 55% o más, o buen histórico que no mejora a comprar cualquier día. Rojo: menos del 55%. Gris: menos de ${D?D.metodo.min_casos:8} casos, no fiable. <b>No es una probabilidad garantizada</b>: es lo que pasó antes, y el futuro puede ser distinto (sobre todo en empresas sueltas).</p>
  <h3>Mediana y escenario malo</h3><p>Mediana: la variación "típica" (la mitad de los casos fue mejor y la otra mitad peor). Escenario malo: el 10% de los peores casos fue igual o peor que esa cifra. Es lo que conviene estar dispuesta a aguantar.</p>
  <h3>Volatilidad</h3><p>Cuánto se mueve normalmente el precio en un año. Un índice amplio ronda el 15–20%; una tecnológica suelta puede pasar del 40–50%. A más volatilidad, más grandes son las caídas "normales" y menos significa una caída concreta.</p>
  <h3>¿Por qué dos productos por sector?</h3><p>Los ETF sectoriales de EE. UU. (XLK, XLE…) tienen historia desde 1998 y dan estadísticas más sólidas, pero un particular en la UE no puede comprarlos (normativa PRIIPs). Por eso el panel muestra al lado el ETF europeo (UCITS) equivalente, de ámbito mundial, que sí puedes comprar.</p>
  <h3>Cuándo comprar en Trade Republic</h3><p>Con horizonte de 1 a 12 meses, la hora importa poco; lo que importa es el diferencial entre compra y venta. ETF europeos: entre las 9:30 y las 17:30. Acciones de EE. UU.: a partir de las 15:30, con Nueva York abierto.</p>
  <h3>Fiscalidad (España)</h3><p>Los fondos indexados permiten traspasar de un fondo a otro sin tributar hasta el reembolso final; los ETF y las acciones tributan cada vez que vendes con ganancia. Confírmalo con tu asesor fiscal.</p>
  <h3>Cuándo se actualiza</h3><p>De lunes a viernes, hacia las 11:30 de Madrid (GitHub puede retrasarlo unos minutos). A esa hora, los precios europeos son de la sesión en curso y los de EE. UU. son el cierre del día anterior. El análisis cualitativo se genera cada lunes con Claude.</p>
  <h3>Cambiar qué se vigila</h3><p>Todo está en el fichero <code>config/universo.yaml</code> del repositorio: empresas, umbrales de alerta y plan por tramos.</p></div>`;
}
