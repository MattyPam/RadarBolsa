name: Actualización diaria

on:
  schedule:
    # 10:30 UTC = 11:30 en Madrid en invierno (12:30 en verano). L-V.
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write
  issues: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos y calcular
        run: python scripts/actualizar.py

      - name: Guardar datos
        run: |
          git config user.name "radarbolsa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data config/sp500_cache.csv 2>/dev/null || git add docs/data
          git diff --cached --quiet || git commit -m "Datos $(TZ=Europe/Madrid date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push

      - name: Avisar de alertas nuevas (email vía GitHub)
        if: hashFiles('alertas_nuevas.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create alerta --color D03B3B --description "Alerta de caída" 2>/dev/null || true
          gh issue create \
            --title "RadarBolsa · alertas nuevas $(TZ=Europe/Madrid date +'%d/%m/%Y')" \
            --body "$(cat alertas_nuevas.md)

" \
            --label alerta \
            --assignee "${{ github.repository_owner }}"
