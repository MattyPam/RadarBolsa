name: Actualización diaria

on:
  schedule:
    # 10:30 UTC = 11:30 en Madrid en invierno (12:30 en verano). L-V.
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write
  issues: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar el estado anterior (alertas, lista del S&P 500)
        run: |
          mkdir -p salida
          if git fetch --depth 1 origin datos 2>/dev/null; then
            git show origin/datos:alertas_estado.json > salida/alertas_estado.json 2>/dev/null || true
            git show origin/datos:sp500_cache.csv > salida/sp500_cache.csv 2>/dev/null || true
          fi

      - name: Descargar datos y calcular
        run: python scripts/actualizar.py

      - name: Publicar en la rama "datos" (se sobrescribe, sin historial)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd salida
          git init -q -b datos
          git config user.name "radarbolsa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Datos $(TZ=Europe/Madrid date +'%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" datos

      - name: Avisar de alertas nuevas (email vía GitHub)
        if: hashFiles('alertas_nuevas.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create alerta --color D03B3B --description "Alerta de caída" 2>/dev/null || true
          gh issue create \
            --title "RadarBolsa · novedades $(TZ=Europe/Madrid date +'%d/%m/%Y')" \
            --body-file alertas_nuevas.md \
            --label alerta \
            --assignee "${{ github.repository_owner }}"
